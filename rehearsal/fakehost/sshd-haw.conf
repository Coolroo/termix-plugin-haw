# Key-only logins, verbose log on stderr (docker logs).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
LogLevel VERBOSE
AllowUsers vmctl nohaw garbage

# HAW's account: one fixed command, nothing else.
Match User vmctl
    ForceCommand node /opt/haw/vmctl-fake.mjs --state /var/lib/haw/state.json --config /etc/haw/vmctl.json
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no

# An account whose forced command answers with garbage (the protocol path).
Match User garbage
    ForceCommand /opt/haw/garbage.sh
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no

# nohaw has no forced command: its shell runs what HAW sends (vmctl missing).
